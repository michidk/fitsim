<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ESP32 Fitness Simulator</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top" id="top">
  <div class="top-row">
    <h1>ESP32 Fitness Simulator</h1>
    <span id="conn" class="conn" role="status" aria-live="polite">Connecting...</span>
  </div>
  <nav id="nav" aria-label="Main">
    <a href="#/dashboard">Dashboard</a>
    <a href="#/events">Event Log</a>
    <a href="#/settings">Settings</a>
  </nav>
  <div id="banner" class="banner" role="alert" hidden>Disconnected - reconnecting...</div>
</header>
<main id="app"><p class="muted pad">Loading...</p></main>
<div id="toasts" aria-live="polite"></div>
<noscript><p class="pad">This control panel needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
